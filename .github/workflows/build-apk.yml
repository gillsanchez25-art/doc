
name: Compilar AeroDoc APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Instalar Capacitor
        run: npm install @capacitor/core@^7 @capacitor/cli@^7 @capacitor/android@^7 --legacy-peer-deps

      - name: Compilar aplicacion web
        run: npm run build

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Sincronizar aplicacion Android
        run: npx cap sync android

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Guardar compilacion web
        uses: actions/upload-artifact@v4
        with:
          name: AeroDoc-web
          path: dist/

      - name: Guardar APK Android
        uses: actions/upload-artifact@v4
        with:
          name: AeroDoc-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
